<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matchup &amp; Spirit Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --panel:    #12121e;
      --orange:   #ff6a00;
      --blue:     #00d4ff;
      --text:     #f0f0f0;
      --muted:    #888;
      --border:   #1e1e30;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Arial Black', 'Impact', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: linear-gradient(90deg, var(--orange), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      line-height: 1.15;
    }

    header p {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
      font-weight: normal;
      font-family: Arial, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Angled card ── */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      padding: 1.75rem 2rem;
      width: 100%;
      max-width: 580px;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 1.1rem;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }

    /* ── Result rows ── */
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
    }

    .result-row:last-child { border-bottom: none; }

    .result-label {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      flex-shrink: 0;
      margin-right: 1rem;
    }

    .result-value {
      font-size: 1.15rem;
      font-style: italic;
      font-weight: 900;
      color: var(--orange);
      text-align: right;
      transition: color 0.1s;
      min-height: 1.4em;
    }

    .result-value.shuffle {
      color: var(--blue);
    }

    /* ── Button ── */
    .btn {
      display: block;
      width: 100%;
      max-width: 580px;
      padding: 1rem;
      background: linear-gradient(90deg, var(--orange), #ff9500);
      color: #000;
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border: none;
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      transition: filter 0.15s, transform 0.1s;
      margin-bottom: 1.5rem;
    }

    .btn:hover  { filter: brightness(1.15); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled {
      background: linear-gradient(90deg, #663300, #664000);
      cursor: not-allowed;
      filter: none;
    }

    /* ── History ── */
    .history-list {
      list-style: none;
      font-family: Arial, sans-serif;
      font-size: 0.82rem;
    }

    .history-list li {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      line-height: 1.5;
    }

    .history-list li:last-child { border-bottom: none; }

    .history-list li span.hi-num {
      color: var(--blue);
      font-weight: bold;
      margin-right: 0.4rem;
    }

    .history-list li span.hi-val {
      color: var(--text);
      font-style: italic;
    }

    .history-empty {
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.82rem;
      font-style: italic;
    }

    /* ── Neon glow decorations ── */
    .glow-line {
      width: 100%;
      max-width: 580px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--orange), var(--blue), transparent);
      margin-bottom: 2rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <header>
    <h1>Matchup &amp; Spirit<br>Generator</h1>
    <p>Arcade Edition &mdash; Insert Coin to Play</p>
  </header>

  <div class="glow-line"></div>

  <!-- Result card -->
  <div class="card" id="result-card">
    <div class="card-title">&#x25B6; Current Match</div>
    <div class="result-row">
      <span class="result-label">Opponent</span>
      <span class="result-value" id="val-opponent">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">Stage</span>
      <span class="result-value" id="val-stage">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">Custom Rule</span>
      <span class="result-value" id="val-rule">—</span>
    </div>
  </div>

  <!-- Generate button -->
  <button class="btn" id="generate-btn" onclick="generateMatch()">&#x26A1; Generate Match</button>

  <!-- Match history -->
  <div class="card" id="history-card">
    <div class="card-title">&#x1F4DC; Match History</div>
    <ul class="history-list" id="history-list">
      <li class="history-empty">No matches yet. Hit Generate!</li>
    </ul>
  </div>

  <script>
    const OPPONENTS   = ['Donkey Kong', 'Kirby', 'Bowser', 'Captain Falcon', 'Samus', 'Mewtwo'];
    const STAGES      = ['Battlefield', 'Final Destination', 'Hazard Heavy'];
    const RULES       = ['Heavyweights Only', 'Start with 30% Damage', 'Sudden Death', 'Item Rain'];

    const MAX_HISTORY = 5;
    const history     = [];

    function rand(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateMatch() {
      const btn = document.getElementById('generate-btn');
      btn.disabled = true;

      const fields = [
        { id: 'val-opponent', pool: OPPONENTS },
        { id: 'val-stage',    pool: STAGES    },
        { id: 'val-rule',     pool: RULES     },
      ];

      // Mark all as shuffling
      fields.forEach(f => {
        document.getElementById(f.id).classList.add('shuffle');
      });

      const DURATION  = 1500; // ms
      const INTERVAL  =   60; // ms between flickers
      const start     = Date.now();

      const ticker = setInterval(() => {
        fields.forEach(f => {
          document.getElementById(f.id).textContent = rand(f.pool);
        });

        if (Date.now() - start >= DURATION) {
          clearInterval(ticker);

          // Settle on final values
          const final = {
            opponent: rand(OPPONENTS),
            stage:    rand(STAGES),
            rule:     rand(RULES),
          };

          document.getElementById('val-opponent').textContent = final.opponent;
          document.getElementById('val-stage').textContent    = final.stage;
          document.getElementById('val-rule').textContent     = final.rule;

          fields.forEach(f => {
            document.getElementById(f.id).classList.remove('shuffle');
          });

          addHistory(final);
          btn.disabled = false;
        }
      }, INTERVAL);
    }

    function addHistory(match) {
      history.unshift(match);
      if (history.length > MAX_HISTORY) history.pop();

      const list = document.getElementById('history-list');
      list.innerHTML = '';

      history.forEach((m, i) => {
        const li = document.createElement('li');
        li.innerHTML =
          `<span class="hi-num">#${i + 1}</span>` +
          `<span class="hi-val">${m.opponent}</span>` +
          ` &mdash; ` +
          `<span class="hi-val">${m.stage}</span>` +
          ` &mdash; ` +
          `<span class="hi-val">${m.rule}</span>`;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
